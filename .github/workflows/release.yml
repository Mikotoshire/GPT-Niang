name: Validate Windows maintenance release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - gpt-niang-usage/**

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Node runtime tests
        working-directory: gpt-niang-usage
        run: npm test
      - name: Release privacy and packaging tests
        run: python -m unittest discover -s scripts -p "test_release.py"
      - name: Verify pure Windows physics and startup migration
        shell: powershell
        run: |
          & gpt-niang-usage/tests/gravity.test.ps1
          & gpt-niang-usage/tests/floor-contact.test.ps1
          & gpt-niang-usage/tests/horizontal-impact.test.ps1
          & gpt-niang-usage/tests/startup-directory.test.ps1
      - name: Build committed and audited Windows bundle
        run: python scripts/build-release.py
# Publishing is explicit after local review. No automatic upstream/Mac release,
# tag moves, asset clobbering or user credentials in this workflow.
